<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=400">
  <link rel="stylesheet" href="../styles/shared.css">
  <link rel="stylesheet" href="popup.css">
  <title>OCR Pro</title>
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <div class="popup-logo">
        <img src="../icons/icon48.png" alt="" width="24" height="24">
        <span class="popup-title">OCR Pro</span>
      </div>
      <button class="btn btn-icon" id="btn-settings" title="Settings" aria-label="Settings">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M7.07 1.29c.15-.74 1.22-.74 1.37 0l.2.97c.04.17.15.31.3.39.16.08.34.09.5.02l.91-.4c.68-.3 1.38.42 1.06 1.09l-.44.9c-.08.16-.09.34-.01.5.07.16.21.28.38.32l.97.22c.74.17.74 1.22 0 1.38l-.97.22c-.17.04-.31.16-.38.32-.08.16-.07.34.01.5l.44.9c.32.67-.38 1.39-1.06 1.09l-.91-.4c-.16-.07-.34-.06-.5.02-.15.08-.26.22-.3.39l-.2.97c-.15.74-1.22.74-1.37 0l-.2-.97a.58.58 0 00-.3-.39.58.58 0 00-.5-.02l-.91.4c-.68.3-1.38-.42-1.06-1.09l.44-.9c.08-.16.09-.34.01-.5a.58.58 0 00-.38-.32l-.97-.22c-.74-.16-.74-1.21 0-1.38l.97-.22c.17-.04.31-.16.38-.32.08-.16.07-.34-.01-.5l-.44-.9c-.32-.67.38-1.39 1.06-1.09l.91.4c.16.07.34.06.5-.02.15-.08.26-.22.3-.39l.2-.97zM8 10a2 2 0 100-4 2 2 0 000 4z"/>
        </svg>
      </button>
    </header>

    <div class="popup-actions">
      <button class="btn btn-primary" id="btn-area">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M1 2.5A1.5 1.5 0 012.5 1h3a.5.5 0 010 1h-3a.5.5 0 00-.5.5v3a.5.5 0 01-1 0v-3zm12 0a.5.5 0 00-.5-.5h-3a.5.5 0 010-1h3A1.5 1.5 0 0114.5 2.5v3a.5.5 0 01-1 0v-3zM1.5 10a.5.5 0 01.5.5v3a.5.5 0 00.5.5h3a.5.5 0 010 1h-3A1.5 1.5 0 011 13.5v-3a.5.5 0 01.5-.5zm13 0a.5.5 0 01.5.5v3a1.5 1.5 0 01-1.5 1.5h-3a.5.5 0 010-1h3a.5.5 0 00.5-.5v-3a.5.5 0 01.5-.5z"/></svg>
        Select Area
      </button>
      <button class="btn btn-primary" id="btn-fullpage">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M4 0a2 2 0 00-2 2v12a2 2 0 002 2h8a2 2 0 002-2V2a2 2 0 00-2-2H4zm0 1h8a1 1 0 011 1v12a1 1 0 01-1 1H4a1 1 0 01-1-1V2a1 1 0 011-1z"/></svg>
        Full Page
      </button>
    </div>

    <div class="popup-upload" id="upload-zone">
      <input type="file" id="file-input" accept="image/*" hidden>
      <div class="upload-content">
        <svg width="28" height="28" viewBox="0 0 16 16" fill="var(--color-text-secondary)"><path d="M7.646 4.146a.5.5 0 01.708 0l3 3a.5.5 0 01-.708.708L8.5 5.707V14.5a.5.5 0 01-1 0V5.707L5.354 7.854a.5.5 0 11-.708-.708l3-3z"/><path d="M4.406 1.342A5.53 5.53 0 018 0c2.69 0 4.923 2 5.166 4.579C14.758 4.804 16 6.137 16 7.773 16 9.569 14.502 11 12.687 11H10a.5.5 0 010-1h2.688C13.979 10 15 8.988 15 7.773c0-1.216-1.02-2.228-2.313-2.228h-.5v-.5C12.188 2.825 10.328 1 8 1a4.53 4.53 0 00-2.941 1.1c-.757.652-1.153 1.438-1.153 2.055v.448l-.445.049C2.064 4.805 1 5.952 1 7.318 1 8.785 2.23 10 3.781 10H6a.5.5 0 010 1H3.781C1.708 11 0 9.366 0 7.318c0-1.763 1.266-3.223 2.942-3.593.143-.863.698-1.723 1.464-2.383z"/></svg>
        <p>Drop image here or <a href="#" id="btn-browse">browse</a></p>
      </div>
    </div>

    <div class="popup-url">
      <input type="text" class="input" id="url-input" placeholder="Paste image URL...">
      <button class="btn btn-primary btn-sm" id="btn-url-ocr">OCR</button>
    </div>

    <div class="popup-lang">
      <label for="lang-select">Language:</label>
      <select class="input" id="lang-select" style="width:auto;flex:1">
        <option value="eng">English</option>
        <option value="tha">Thai</option>
        <option value="eng+tha" selected>English + Thai</option>
        <option value="jpn">Japanese</option>
        <option value="chi_sim">Chinese (Simplified)</option>
        <option value="chi_tra">Chinese (Traditional)</option>
        <option value="kor">Korean</option>
      </select>
    </div>

    <div class="popup-status" id="status-area" hidden>
      <div class="progress-bar">
        <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
      </div>
      <p class="status-text" id="status-text">Ready</p>
    </div>

    <div class="popup-result" id="result-area" hidden>
      <p class="result-preview" id="result-preview"></p>
      <div style="display:flex;gap:6px">
        <button class="btn btn-sm btn-primary" id="btn-copy-result">Copy</button>
        <button class="btn btn-sm" id="btn-open-panel">Open in Side Panel</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="popup.js" type="module"></script>
</body>
</html>
